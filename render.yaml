services:
  - type: web
    name: famsurance
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /data/app.db
      - key: DATA_KEY
        generateValue: true
    disk:
      name: famsurance-data
      mountPath: /data
      sizeGB: 1
