services:
  - type: web
    name: needs-finder
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /data/app.db
      - key: DATA_KEY
        generateValue: true
    disk:
      name: needs-finder-data
      mountPath: /data
      sizeGB: 1
